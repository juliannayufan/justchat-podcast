<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>《就是聊聊》播客 ShowNotes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f5;
      color: #1f1f1f;
      line-height: 1.8;
      padding: 40px 20px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .hero img {
      width: 100%;
      display: block;
      object-fit: cover;
      max-height: 420px;
    }

    .content {
      padding: 40px;
    }

    .tag {
      display: inline-block;
      background: #111;
      color: white;
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }

    h1 {
      font-size: 42px;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .subtitle {
      color: #666;
      font-size: 18px;
      margin-bottom: 32px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 40px;
      color: #777;
      font-size: 14px;
    }

    .section {
      margin-bottom: 42px;
    }

    .section h2 {
      font-size: 24px;
      margin-bottom: 16px;
    }

    .section p {
      margin-bottom: 16px;
    }

    .links a {
      display: inline-block;
      margin-right: 12px;
      margin-bottom: 12px;
      text-decoration: none;
      color: white;
      background: #1f1f1f;
      padding: 10px 16px;
      border-radius: 999px;
      transition: 0.2s ease;
    }

    .links a:hover {
      opacity: 0.85;
    }

    .location-image img {
      width: 100%;
      border-radius: 16px;
      margin-bottom: 12px;
    }

    .caption {
      color: #666;
      font-size: 14px;
    }

    footer {
      margin-top: 60px;
      padding-top: 24px;
      border-top: 1px solid #eee;
      color: #888;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 640px) {
      .content {
        padding: 28px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <div class="container">

      <!-- 标签 -->
      <div class="tag">PODCAST EPISODE</div>

      <!-- 标题 -->
      <h1>Episode 01 — 搞笑开播，就是笑着聊聊</h1>

      <!-- 副标题 -->
      <div class="subtitle">
        线上夜谈
      </div>

      <!-- 节目信息 -->
      <div class="meta">
        <span>🎙 主播：橘里安</span>
        <span>👤 嘉宾：凯越</span>
        <span>📅 March 26, 2026</span>
      </div>

      <!-- 平台链接 -->
      <div class="section">
        <h2>收听平台</h2>
        <div class="links">
          <a href="https://www.xiaoyuzhoufm.com/episode/69c4e8c3e73b70b045f17fe7" target="_blank">小宇宙</a>
          <a href="https://podcasts.apple.com/cn/podcast/%E6%90%9E%E7%AC%91%E5%BC%80%E6%92%AD-%E5%B0%B1%E6%98%AF%E7%AC%91%E7%9D%80%E8%81%8A%E8%81%8A-ep01/id1888537321?i=1000757747643&l=en-GB" target="_blank">Apple Podcasts</a>
        </div>
      </div>

      <footer>
        感谢收听，咱们下期再见<br>
        See you next time.
      </footer>

    </div>
  </div>
</body>
</html>
