<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Just Chat Podcast</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f6f6;
      margin: 0;
      padding: 40px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 32px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
      text-decoration: none;
      color: black;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .cover {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 16px;
    }

    .title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .date {
      font-size: 13px;
      color: #777;
    }

    .tag {
      display: inline-block;
      margin-top: 10px;
      font-size: 12px;
      background: #111;
      color: white;
      padding: 4px 10px;
      border-radius: 999px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🎙 《就是聊聊》中文播客</h1>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    // 👉 在这里添加你的所有 episode
    const episodes = [
      {
        title: "Episode 03 — 当我们占卜时，我们究竟想知道什么？",
        link: "ep03.html",
        date: "2026-08-29",
        cover: "https://imgur.com/jCMZ3Yf.jpeg"
      },
      {
        title: "Episode 02 — 怎么也逃不出形而上学的世界",
        link: "ep02.html",
        date: "2026-05-22",
        cover: "https://i.imgur.com/RHIUbU9.jpeg"
      },
      {
        title: "Episode 01 — 搞笑开播，就是笑着聊聊",
        link: "ep01.html",
        date: "2026-03-26",
        cover: "https://i.imgur.com/7dWSKug.png"
      }
    ];

    // 👉 自动按时间排序（最新在前）
    episodes.sort((a, b) => new Date(b.date) - new Date(a.date));

    const grid = document.getElementById("grid");

    episodes.forEach(ep => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = ep.link;

      a.innerHTML = `
        <img class="cover" src="${ep.cover}" />
        <div class="content">
          <div class="title">${ep.title}</div>
          <div class="date">${ep.date}</div>
          <div class="tag">Episode</div>
        </div>
      `;

      grid.appendChild(a);
    });
  </script>
</body>
</html>
